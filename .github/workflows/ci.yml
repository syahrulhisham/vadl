# Continuous integration for VADL. Runs every check from `npm run check`, then the
# cross-browser integration pass (Firefox, WebKit) and the sub-folder deployment
# check. It deploys nothing: hosting is the owner's decision (D12,
# docs/guides/deployment.md). Course materials are git-ignored and never reach CI.
name: CI

on:
  push:
    branches: [main, 'milestone-*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npx playwright test tests/e2e/integration.spec.ts --project=firefox --project=webkit
      - run: npm run test:e2e:base
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
